summary: >
Royalty OS v0.2 transforms the Royalty OS model from a static
recognition record into an event-based value circulation architecture.
It introduces append-only event logs, AI-assisted detection, human review,
dynamic value signals, allocation decisions, and return history while
preserving the v0.1 origin-trace-value chain.

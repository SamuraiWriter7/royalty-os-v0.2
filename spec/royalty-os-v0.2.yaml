event_model:
append_only: true
mutation_policy: >
Existing events should not be silently modified. Corrections,
disputes, review changes, and status changes should be recorded as
new events.

```
event_ordering:
  primary_order: "event_time"
  optional_order_fields:
    - "event_index"
    - "created_at"
    - "log_order"

allowed_event_status:
  - "draft"
  - "pending"
  - "pending_review"
  - "approved"
  - "rejected"
  - "disputed"
  - "completed"
  - "superseded"
  - "retracted"
  - "archived"

event_types:
  origin_events:
    - "origin_registered"
    - "origin_updated"
    - "origin_deprecated"

  trace_events:
    - "trace_created"
    - "trace_updated"
    - "trace_linked"
    - "trace_version_updated"

  reference_events:
    - "reference_detected"
    - "citation_added"
    - "linkback_added"
    - "conceptual_reference_detected"
    - "structural_dependency_detected"
    - "implementation_dependency_detected"
    - "derivative_work_registered"
    - "translation_registered"
    - "summary_registered"

  ai_related_events:
    - "ai_reference_detected"
    - "ai_similarity_detected"
    - "ai_summary_detected"
    - "ai_derivative_detected"
    - "ai_assisted_review_created"

  review_events:

review_layer:
review_requirement_levels:
- "none"
- "optional"
- "recommended"
- "required"

```
events_usually_requiring_review:
  - "ai_reference_detected"
  - "ai_similarity_detected"
  - "ai_derivative_detected"
  - "conceptual_reference_detected"
  - "structural_dependency_detected"
  - "implementation_dependency_detected"
  - "derivative_work_registered"
  - "commercial_reference_detected"
  - "value_signal_upgraded"
  - "allocation_decision_created"
  - "compensation_recorded"

events_may_skip_review_when_evidence_is_clear:
  - "citation_added"
  - "linkback_added"
  - "repository_reference_completed"
  - "acknowledgement_completed"
  - "origin_registered"
  - "trace_created"
  - "version_updated"

ai_review_policy:
  ai_may:
    - "detect references"
    - "summarize evidence"
    - "suggest value signal strength"
    - "flag possible disputes"
    - "recommend review priority"
  ai_should_not:
    - "approve high-impact value events without human review"
    - "assign final allocation"
    - "declare ownership"
    - "settle disputes"
    - "trigger compensation"
    - "erase or rewrite past events"
```

allocation_layer:
default_policy: "non_monetary_first"
recommended_policies:
- "origin_recognition_first"
- "review_required_before_allocation"
- "non_monetary_first"
- "human_review_required_for_high_value"
- "manual_approval_required"
- "q_point_assisted"
- "experimental_dynamic_allocation"

```
signal_strength_guidance:
  low:
    suggested_allocation:
      - "optional citation"
      - "optional note"
  medium:
    suggested_allocation:
      - "citation"
      - "linkback"
      - "attribution"
  high:
    suggested_allocation:
      - "citation"
      - "linkback"
      - "conceptual attribution"
      - "repository reference"
  critical:
    suggested_allocation:
      - "full attribution"
      - "repository reference"
      - "acknowledgement"
      - "possible licensing or compensation review"
```


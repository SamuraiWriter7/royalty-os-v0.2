royalty_os_spec:
spec_id: "royalty-os-v0.2"
title: "Royalty OS v0.2"
subtitle: "Event-Based Trace-to-Value Circulation Architecture"
version: "0.2.0-draft"
status: "draft"
date_created: "2026-06-04"
license: "MIT"
language: "en"

maintainers:
- name: "SamuraiWriter7"
role: "originator"

summary: >
Royalty OS v0.2 is an experimental event-based architecture for
connecting traceable human-originated thought to dynamic value circulation.
It extends the static Royalty OS v0.1 record model into an append-only
value event log with review, allocation, and return history layers.

base_version:
previous_spec_id: "royalty-os-v0.1"
relationship: "event-based extension"
description: >
Royalty OS v0.1 defines the static minimum recognition model.
Royalty OS v0.2 extends that model into an event-based value
circulation architecture.

purpose:
- "Represent value circulation as an evolving event history."
- "Record references, reviews, value signals, allocation decisions, and returns over time."
- "Support AI-assisted detection while preserving human review."
- "Introduce modular schema architecture."
- "Prepare for future Q-Point, attribution scoring, dashboards, and compensation mechanisms."

non_goals:
- "Legally binding royalty enforcement"
- "Automatic payment execution"
- "Universal AI training data tracking"
- "Copyright dispute resolution"
- "Court-admissible ownership proof"
- "Mandatory blockchain storage"
- "Complete platform monetization"

core_principles:
- principle_id: "origin_remains_visible"
name: "Origin Remains Visible"
description: >
Human-originated thought should remain connected to its origin even
when referenced, summarized, transformed, or reused.

```
- principle_id: "append_only_history"
  name: "Append-Only History"
  description: >
    Value circulation should be recorded as an append-only event history.
    Existing events should not be silently rewritten.

- principle_id: "detection_is_not_judgment"
  name: "Detection Is Not Judgment"
  description: >
    AI may detect possible references or dependencies, but human review
    remains important for judgment, especially for high-impact events.

- principle_id: "review_before_high_impact_allocation"
  name: "Review Before High-Impact Allocation"
  description: >
    High-impact allocation decisions should normally require approved
    review before return or compensation is recorded.

- principle_id: "return_history_separates_intent_from_completion"
  name: "Return History Separates Intent From Completion"
  description: >
    Allocation decisions define what should return. Return records define
    what actually returned.

- principle_id: "non_monetary_first"
  name: "Non-Monetary First"
  description: >
    v0.2 prioritizes citation, linkback, conceptual attribution,
    repository reference, acknowledgement, and visible recognition before
    monetary compensation.
```

conceptual_flow:
- step: 1
name: "Origin"
description: "The human-originated source of a question, concept, structure, protocol, specification, essay, or creative work."

```
- step: 2
  name: "Trace Record"
  description: "A structured record of origin and lineage."

- step: 3
  name: "Value Event Log"
  description: "An append-only sequence of events related to references, reviews, value signals, allocations, corrections, disputes, and returns."

- step: 4
  name: "Review Layer"
  description: "A layer for AI-assisted detection, human review, evidence assessment, confidence scoring, disputes, and corrections."

- step: 5
  name: "Dynamic Value Signal"
  description: "A value signal that can evolve over time as new events, reviews, and evidence appear."

- step: 6
  name: "Allocation Layer"
  description: "A layer for determining proposed or approved return methods based on reviewed value signals."

- step: 7
  name: "Return History"
  description: "A record of completed value returns, including attribution, citation, linkback, acknowledgement, point allocation, or future compensation."
```

architecture_layers:
- layer_id: "origin_layer"
name: "Origin Layer"
purpose: "Record human-originated sources."
primary_objects:
- "origin_record"

```
- layer_id: "trace_layer"
  name: "Trace Layer"
  purpose: "Record origin lineage and conceptual ancestry."
  primary_objects:
    - "trace_record"

- layer_id: "value_event_log"
  name: "Value Event Log"
  purpose: "Record meaningful changes in value circulation as events."
  primary_objects:
    - "value_event"
    - "value_event_log"

- layer_id: "review_layer"
  name: "Review Layer"
  purpose: "Evaluate detected references, evidence quality, value signal strength, and disputes."
  primary_objects:
    - "review_record"

- layer_id: "allocation_layer"
  name: "Allocation Layer"
  purpose: "Connect reviewed value signals to proposed or approved return methods."
  primary_objects:
    - "allocation_decision"

- layer_id: "return_history_layer"
  name: "Return History Layer"
  purpose: "Record completed return or recognition."
  primary_objects:
    - "return_record"
```

